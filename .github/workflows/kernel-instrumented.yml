name: kernel-instrumented

# Reproduces the exact kernel the device runs (tag v6.19.5-msm8996) with
# bring-up probes injected, so the silent hang inside gpiochip_add_data()
# can be localised to a single step.
#
# Two constraints shape this file:
#   * the GitHub artifact/log API is unreachable from the workstation (the
#     token is rejected by api.github.com) -> results ride on the orphan
#     branch "dist" (Image.gz + build.log + META.txt), published by
#     tools/ci/publish.sh;
#   * a cold kernel build costs ~25 min -> the whole build tree "k/" is
#     cached, so re-runs only recompile the two instrumented files (minutes).
#
# The very first publish is a heartbeat: if it never appears, the job did not
# start at all (invalid workflow file, no runner, ...) rather than failing
# inside a build step.

on:
  push:
    branches: [main]
    paths:
      - "tools/ci/**"
      - "configs/**"
      - ".github/workflows/kernel-instrumented.yml"
  workflow_dispatch:
    inputs:
      instrument:
        description: "注入 bring-up 探针（排查用，默认关闭）"
        type: boolean
        default: false
      clean:
        description: "丢弃构建树缓存，从零冷编译（~25 分钟）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # 目标版本串必须与 pmOS 的 linux-postmarketos-qcom-msm8996 模块包完全一致，
      # 否则 /lib/modules/6.19.5-postmarketos-qcom-msm8996 下所有 .ko 都会被拒。
      WANT_KREL: 6.19.5-postmarketos-qcom-msm8996
      INSTRUMENT: ${{ inputs.instrument && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: self

      - name: 心跳（作业已启动）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          chmod +x self/tools/ci/publish.sh
          echo "job started $(date -u +%FT%TZ)" > build.log
          echo "instrument=${INSTRUMENT:-0} clean=${{ inputs.clean }}" | tee -a build.log
          self/tools/ci/publish.sh start running

      - name: 恢复内核构建树
        uses: actions/cache@v4
        with:
          # clean=true 时换 key，直接落到 kbuild-v2-cold 的 restore-keys 上（必然 miss）
          path: k
          key: ${{ inputs.clean && 'kbuild-v2-cold' || format('kbuild-v2-{0}', hashFiles('self/configs/*.config')) }}
          restore-keys: |
            kbuild-v2-cold-
            kbuild-v2-

      - name: 依赖
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang lld llvm bc bison flex \
            libssl-dev libelf-dev cpio kmod zstd python3

      - name: 准备源码（命中缓存则复用，否则克隆 + 配置）
        run: |
          set -eux
          if [ -d k/.git ]; then
            echo "cache hit: reusing build tree"
            # 缓存树里的探针是未提交改动，checkout 即可撤销（不动 .o 产物与时间戳）
            git -C k checkout -- .
          else
            echo "cache miss: full clone + configure"
            git clone --depth 1 --branch v6.19.5-msm8996 \
              https://gitlab.com/msm8996-mainline/linux.git k
            cp self/configs/msm8996-6.19.5-pmos.config k/.config
            cd k
            scripts/config --file .config \
              -d DEBUG_INFO -e DEBUG_INFO_NONE \
              -d DEBUG_INFO_BTF -d DEBUG_INFO_DWARF5 -d GDB_SCRIPTS
            make ARCH=arm64 LLVM=1 olddefconfig
          fi
          grep -E "^CONFIG_(PINCTRL_MSM8996|MMC_SDHCI_MSM|USB_DWC3|MODULES)=" k/.config | tee -a build.log

      - name: 追加配置（Synaptics RMI4 触摸）
        # 用 scripts/config 增量改，而不是改 configs/*.config —— 这样构建树缓存 key 不变，
        # 命中缓存后只重编受影响的文件（分钟级），不必再冷编译 25 分钟。
        run: |
          set -eux
          cd k
          scripts/config --file .config \
            -e RMI4_CORE -e RMI4_I2C \
            -e RMI4_F01 -e RMI4_F11 -e RMI4_F12 -e RMI4_F30 -e RMI4_F34 \
            -e INPUT_EVDEV
          # 版本串必须和 pmOS 包里的模块一致，否则 vermagic 不匹配、所有 .ko 被拒
          # （pmOS: uname -r = 6.19.5-postmarketos-qcom-msm8996）
          # LOCALVERSION_AUTO 会在注入探针后给版本加 "+"，必须关掉
          scripts/config --file .config \
            --set-str LOCALVERSION "-postmarketos-qcom-msm8996" \
            -d LOCALVERSION_AUTO
          make ARCH=arm64 LLVM=1 olddefconfig
          # 版本串的第三层：setlocalversion 里有 `elif [ "${LOCALVERSION+set}" != "set" ]`，
          # 只要 LOCALVERSION 这个 shell 变量“未设置”（哪怕 CONFIG_LOCALVERSION 已经
          # 非空），它就会在末尾追加 "+"。.scmversion 只影响 git 探测，治不了这一层。
          # 唯一可靠的做法：在 make 命令行上显式写出空的 LOCALVERSION=。
          # 因此下面凡是问内核版本的地方，都必须带 LOCALVERSION=。
          KREL="$(make -s ARCH=arm64 LOCALVERSION= kernelrelease)"
          case "$KREL" in
            "$WANT_KREL") echo "vermagic OK: $KREL" | tee -a ../build.log ;;
            *)
              echo "vermagic MISMATCH: got '$KREL' want '$WANT_KREL'" | tee -a ../build.log
              exit 1
              ;;
          esac
          grep -E "^CONFIG_(RMI4|INPUT_EVDEV|INPUT_TOUCHSCREEN|LOCALVERSION)" .config | tee -a ../build.log
          echo "KREL=$KREL" >> "$GITHUB_ENV"

      - name: 注入探针（INSTRUMENT 输入为 true 才做）
        # 刻意不 commit：探针保持为未提交改动，下一次命中缓存时用 checkout -- . 就能撤销。
        # 脏树之所以不再有害，是因为编译全程都带 LOCALVERSION=，setlocalversion 直接短路。
        run: |
          set -eux
          cd k
          if [ "${INSTRUMENT:-0}" = "1" ]; then
            python3 ../self/tools/ci/instrument.py . 2>&1 | tee -a ../build.log
          else
            echo "production build: no instrumentation" | tee -a ../build.log
          fi

      - name: 发布（探针阶段）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: self/tools/ci/publish.sh proto "${{ job.status }}"

      - name: 编译 Image.gz
        run: |
          set -euo pipefail
          cd k
          time make -j"$(nproc)" ARCH=arm64 LLVM=1 LOCALVERSION= Image.gz 2>&1 | tee -a ../build.log
          ls -l arch/arm64/boot/Image.gz | tee -a ../build.log

          # 三重版本串闸门：命令行参数 -> kernelrelease -> vmlinux 里真实的 vermagic 串。
          # 最后一道最关键：它验的是镜像里真被编进去的那个字符串，而不是 Make 的推导结果。
          KREL="$(make -s ARCH=arm64 LOCALVERSION= kernelrelease)"
          if [ "$KREL" != "$WANT_KREL" ]; then
            echo "FAIL: kernelrelease='$KREL' != '$WANT_KREL'" | tee -a ../build.log
            exit 1
          fi
          if ! strings vmlinux | grep -qF "$WANT_KREL preempt"; then
            echo "FAIL: vermagic string not found in vmlinux" | tee -a ../build.log
            strings vmlinux | grep -m5 'preempt' | tee -a ../build.log
            exit 1
          fi
          if strings vmlinux | grep -qF "$WANT_KREL+"; then
            echo "FAIL: vermagic carries a trailing '+'" | tee -a ../build.log
            exit 1
          fi
          echo "OK: vermagic = '$KREL'" | tee -a ../build.log
          echo "KREL=$KREL" >> "$GITHUB_ENV"

      - name: 发布（最终）
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: self/tools/ci/publish.sh final "${{ job.status }}"
